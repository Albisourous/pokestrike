<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e1a" />
    <meta
      name="description"
      content="Pokéstrike — a Pokémon roguelike for your browser. Draft 4 Pokémon, slingshot them like pinballs, ricochet combos off teammates, catch wilds and shinies, and climb 9 stages of gym leaders."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pokéstrike — sling & ricochet Pokémon roguelike" />
    <meta
      property="og:description"
      content="Draft 4 Pokémon, pull back, launch, and bounce through a 9-stage gym climb. Catch wilds, hunt shinies, share your run."
    />
    <meta property="og:url" content="https://albisourous.github.io/pokestrike/" />
    <meta property="og:image" content="https://albisourous.github.io/pokestrike/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://albisourous.github.io/pokestrike/icon-512.png" />
    <meta name="twitter:title" content="Pokéstrike — sling & ricochet Pokémon roguelike" />
    <meta
      name="twitter:description"
      content="Monster Strike physics in a Pokémon skin. Draft, launch, bounce, catch 'em — a new climb every run."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Pokéstrike</title>
    <link rel="preload" href="fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="fonts/RobotoCondensed.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="sprites/25.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      @font-face {
        font-family: 'rc';
        src: url('fonts/RobotoCondensed.ttf') format('truetype');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'ps2p';
        src: url('fonts/PressStart2P-Regular.ttf') format('truetype');
        font-weight: 400;
      }
      html {
        color-scheme: dark;
      }
      html, body, #game {
        touch-action: manipulation;
      }
      .noscript-msg {
        color: #fff;
        font-family: 'ps2p', monospace;
        text-align: center;
        margin-top: 40vh;
      }
    </style>
  </head>
  <body>
    <canvas id="game" role="application" aria-label="Pokéstrike — a pull-and-bounce Pokémon roguelike. Enable JavaScript to play.">
      Pokéstrike needs a browser with canvas support to play.
    </canvas>
    <noscript>
      <p class="noscript-msg">
        Pokéstrike is a JavaScript game — enable JavaScript to sling your team.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
